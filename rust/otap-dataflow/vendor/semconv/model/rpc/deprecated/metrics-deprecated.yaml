groups:
  - id: metric.rpc.client.requests_per_rpc
    type: metric
    metric_name: rpc.client.requests_per_rpc
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1, max: 100 }
          distribution: { type: exponential, mean: 3 }
        bounds: [1, 2, 5, 10, 20, 50, 100]
        observations:
          range: { min: 10, max: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    stability: development
    brief: Measures the number of messages received per RPC.
    instrument: histogram
    unit: "{count}"
    note: |
      Should be 1 for all non-streaming RPCs.

      **Streaming**: This metric is required for server and client streaming RPCs
    extends: attributes.metrics.rpc.client
    deprecated:
      reason: obsoleted
      note: Removed, no replacement at this time.

