        bounds: [0, 100, 500, 1000, 5000, 10000, 50000, 100000, 500000, 1000000, 5000000]
        observations:
          range: { min: 10, max: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    stability: development
    brief: Measures the size of RPC request messages (uncompressed).
    instrument: histogram
    unit: "By"
    note: |
      **Streaming**: Recorded per message in a streaming batch
    extends: attributes.metrics.rpc.server
    deprecated:
      reason: obsoleted
      note: Removed, no replacement at this time.

