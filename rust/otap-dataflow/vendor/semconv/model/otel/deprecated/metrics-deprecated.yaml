groups:
  - id: metric.otel.sdk.span.live.count
    type: metric
    metric_name: otel.sdk.span.live.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 500 }
          distribution: { type: normal, mean: 20, stddev: 15 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    stability: development
    deprecated:
      reason: renamed
      renamed_to: otel.sdk.span.live
    brief: "Deprecated, use `otel.sdk.span.live` instead."
    instrument: updowncounter
    unit: "{span}"
  - id: metric.otel.sdk.span.ended.count
