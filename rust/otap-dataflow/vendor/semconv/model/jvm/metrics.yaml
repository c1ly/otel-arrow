groups:
  - id: attributes.jvm.memory
    type: attribute_group
    brief: "Describes JVM memory metric attributes."
    attributes:
      - ref: jvm.memory.type
        requirement_level: recommended
      - ref: jvm.memory.pool.name
        requirement_level: recommended
        brief: Name of the memory pool.

  - id: metric.jvm.memory.used
    type: metric
    metric_name: jvm.memory.used
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    extends: attributes.jvm.memory
    brief: "Measure of memory used."
    instrument: updowncounter
    unit: "By"
    stability: stable

  - id: metric.jvm.memory.committed
    type: metric
    metric_name: jvm.memory.committed
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    extends: attributes.jvm.memory
    brief: "Measure of memory committed."
    instrument: updowncounter
    unit: "By"
    stability: stable

  - id: metric.jvm.memory.limit
    type: metric
    metric_name: jvm.memory.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    extends: attributes.jvm.memory
    brief: "Measure of max obtainable memory."
    instrument: updowncounter
    unit: "By"
    stability: stable

  - id: metric.jvm.memory.used_after_last_gc
    type: metric
    metric_name: jvm.memory.used_after_last_gc
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    extends: attributes.jvm.memory
    brief: "Measure of memory used, as measured after the most recent garbage collection event on this pool."
    instrument: updowncounter
    unit: "By"
    stability: stable

  - id: metric.jvm.gc.duration
    type: metric
    metric_name: jvm.gc.duration
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: lognormal, mean: 0.005, stddev: 0.01 }
        bounds: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1, 5, 10]
        observations:
          range: { min: 10, max: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Duration of JVM garbage collection actions."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: jvm.gc.name
        requirement_level: recommended
      - ref: jvm.gc.action
        requirement_level: recommended
      - ref: jvm.gc.cause
        requirement_level: opt_in
    stability: stable

  - id: metric.jvm.thread.count
    type: metric
    metric_name: jvm.thread.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 500 }
          distribution: { type: normal, mean: 20, stddev: 15 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Number of executing platform threads."
    instrument: updowncounter
    unit: "{thread}"
    attributes:
      - ref: jvm.thread.daemon
        requirement_level: recommended
      - ref: jvm.thread.state
        requirement_level: recommended
    stability: stable

  - id: metric.jvm.class.loaded
    type: metric
    metric_name: jvm.class.loaded
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 100000 }
          distribution: { type: exponential, mean: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Number of classes loaded since JVM start."
    instrument: counter
    unit: "{class}"
    stability: stable

  - id: metric.jvm.class.unloaded
    type: metric
    metric_name: jvm.class.unloaded
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 100000 }
          distribution: { type: exponential, mean: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Number of classes unloaded since JVM start."
    instrument: counter
    unit: "{class}"
    stability: stable

  - id: metric.jvm.class.count
    type: metric
    metric_name: jvm.class.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 500 }
          distribution: { type: normal, mean: 20, stddev: 15 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Number of classes currently loaded."
    instrument: updowncounter
    unit: "{class}"
    stability: stable

  - id: metric.jvm.cpu.count
    type: metric
    metric_name: jvm.cpu.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0.0, max: 64.0 }
          distribution: { type: normal, mean: 4.0, stddev: 4.0 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Number of processors available to the Java virtual machine."
    instrument: updowncounter
    unit: "{cpu}"
    stability: stable

  - id: metric.jvm.cpu.time
    type: metric
    metric_name: jvm.cpu.time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60.0 }
          distribution: { type: exponential, mean: 0.5 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "CPU time used by the process as reported by the JVM."
    instrument: counter
    unit: "s"
    stability: stable

  - id: metric.jvm.cpu.recent_utilization
    type: metric
    metric_name: jvm.cpu.recent_utilization
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: normal, mean: 0.4, stddev: 0.2 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Recent CPU utilization for the process as reported by the JVM."
    note: >
      The value range is [0.0,1.0].
      This utilization is not defined as being for the specific interval since last measurement
      (unlike `system.cpu.utilization`).
      [Reference](https://docs.oracle.com/en/java/javase/17/docs/api/jdk.management/com/sun/management/OperatingSystemMXBean.html#getProcessCpuLoad()).
    instrument: gauge
    unit: "1"
    stability: stable
