        requirement_level: required
    note: >
      Value can be retrieved from value `physical_space_size` of [`v8.getHeapSpaceStatistics()`](https://nodejs.org/api/v8.html#v8getheapspacestatistics)

  - id: metric.v8js.memory.heap.space.size
    type: metric
    metric_name: v8js.memory.heap.space.size
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Total heap memory size pre-allocated for a heap space."
    instrument: updowncounter
