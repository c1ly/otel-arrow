  - id: metric.v8js.resource.active
    type: metric
    metric_name: v8js.resource.active
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 1000 }
          distribution: { type: lognormal, mean: 20, stddev: 40 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Gauge of the active resources that are currently keeping the event loop alive."
