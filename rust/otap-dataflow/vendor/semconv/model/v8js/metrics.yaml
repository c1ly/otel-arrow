groups:
  - id: metric.v8js.gc.duration
    type: metric
    metric_name: v8js.gc.duration
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: lognormal, mean: 0.005, stddev: 0.01 }
        bounds: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1, 5, 10]
        observations:
          range: { min: 10, max: 100 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Garbage collection duration."
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref: v8js.gc.type
        requirement_level: required
    note: >
      The values can be retrieved from [`perf_hooks.PerformanceObserver(...).observe({ entryTypes: ['gc'] })`](https://nodejs.org/api/perf_hooks.html#performanceobserverobserveoptions)

  - id: metric.v8js.memory.heap.space.available_size
    type: metric
    metric_name: v8js.memory.heap.space.available_size
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Heap space available size."
    instrument: updowncounter
    unit: "By"
    stability: development
    attributes:
      - ref: v8js.heap.space.name
        requirement_level: required
    note: >
      Value can be retrieved from value `space_available_size` of [`v8.getHeapSpaceStatistics()`](https://nodejs.org/api/v8.html#v8getheapspacestatistics)

  - id: metric.v8js.memory.heap.space.physical_size
    type: metric
    metric_name: v8js.memory.heap.space.physical_size
    annotations:
      code_generation:
        metric_value_type: int
