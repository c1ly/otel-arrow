        value:
          range: { min: 0, max: 68719476736 }
          distribution: { type: lognormal, mean: 536870912, stddev: 1073741824 }
        data_points:
          values: [1, 2, 3]
          weights: [6, 3, 1]
    brief: "Committed size of a heap space."
    instrument: updowncounter
    unit: "By"
    stability: development
    attributes:
