    unit: "{resource}"
    stability: development
    attributes:
      - ref: v8js.resource.type
        requirement_level: required
    note: >
      The values can be retrieved from [`process.getActiveResourcesInfo()`](https://nodejs.org/api/process.html#processgetactiveresourcesinfo)
